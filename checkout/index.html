<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24132d"><meta name="description" content="Mayumi Kasuga — music, live performances, artist profiles and official merchandise."><title>Checkout | Mayumi Kasuga</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/mobile-fix.css"><link rel="stylesheet" href="../assets/music-motion.css"><link rel="stylesheet" href="../assets/media-player.css"></head><body data-page="checkout" data-depth="1"><div id="header"></div><main><section class="pagehero"><div class="wrap"><span class="eyebrow">SECURE SHOPPING</span><h1>Checkout.</h1><p>Your favourite pieces are just one step away.</p></div></section><section class="section"><div class="wrap split"><form class="panel" id="checkoutForm"><h3>Delivery details</h3><div class="formgrid"><label class="field">Full name<input name="name" required autocomplete="name"></label><label class="field">Email address<input name="email" type="email" required autocomplete="email"></label><label class="field">Phone number<input name="phone" required autocomplete="tel"></label><label class="field">Country<select name="country"><option>Malaysia</option><option>Singapore</option><option>Other</option></select></label><label class="field wide">Street address<input name="address" required autocomplete="street-address"></label><label class="field">City<input name="city" required></label><label class="field">Postcode<input name="postcode" required></label><label class="field wide">Payment method<select name="payment"><option>Card payment</option><option>Online banking</option><option>Digital wallet</option></select></label></div><p class="muted">Your order will be confirmed after the checkout steps.</p><button class="btn primary" style="width:100%" type="submit">Continue to payment →</button></form><div class="panel"><h3>Order summary</h3><div id="checkoutSummary"></div></div></div></section><div class="overlay" id="paymentOverlay"><div class="panel" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,94%);max-height:90vh;overflow:auto"><h2>Confirm payment</h2><p>Review your order and confirm to complete checkout.</p><div id="paymentDetails"></div><div class="btnrow"><button class="btn dark" id="confirmPayment">Confirm payment →</button><button class="btn" id="cancelPayment">Back</button></div></div></div></main><div id="footer"></div><div id="ui"></div><script src="../assets/data.js"></script><script src="../assets/app.js"></script><script src="../assets/media-player.js"></script><script src="../assets/pages.js"></script><script src="../assets/music-motion.js"></script></body></html>
