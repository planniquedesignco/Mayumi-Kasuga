<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24132d"><meta name="description" content="Mayumi Kasuga — music, live performances, artist profiles and official merchandise."><title>Checkout | Mayumi Kasuga</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/mobile-fix.css"><link rel="stylesheet" href="../assets/music-motion.css"><link rel="stylesheet" href="../assets/media-player.css"><link rel="stylesheet" href="../assets/polish.css"><link rel="stylesheet" href="../assets/music-clean.css"><link rel="stylesheet" href="../assets/navigation-reliability.css"><link rel="stylesheet" href="../assets/entrance-media.css"><link rel="stylesheet" href="../assets/mobile-menu-final.css"></head><body data-page="checkout" data-depth="1"><div id="header"></div><main><section class="pagehero"><div class="wrap"><span class="eyebrow">SECURE SHOPPING</span><h1>Checkout.</h1><p>Your favourite pieces are just one step away.</p></div></section><section class="section"><div class="wrap split"><form class="panel" id="checkoutForm"><h3>Delivery details</h3><div class="formgrid"><label class="field">Full name<input name="name" required autocomplete="name"></label><label class="field">Email address<input name="email" type="email" required autocomplete="email"></label><label class="field">Phone number<input name="phone" required autocomplete="tel"></label><label class="field">Country<select name="country"><option>Malaysia</option><option>Singapore</option><option>Other</option></select></label><label class="field wide">Street address<input name="address" required autocomplete="street-address"></label><label class="field">City<input name="city" required></label><label class="field">Postcode<input name="postcode" required></label><label class="field wide">Payment method<select name="payment"><option>Card payment</option><option>Online banking</option><option>Digital wallet</option></select></label></div><p class="muted">Your order will be confirmed after the checkout steps.</p><button class="btn primary" style="width:100%" type="submit">Continue to payment →</button></form><div class="panel"><h3>Order summary</h3><div id="checkoutSummary"></div></div></div></section><div class="overlay" id="paymentOverlay"><div class="panel" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,94%);max-height:90vh;overflow:auto"><h2>Confirm payment</h2><p>Review your order and confirm to complete checkout.</p><div id="paymentDetails"></div><div class="btnrow"><button class="btn dark" id="confirmPayment">Confirm payment →</button><button class="btn" id="cancelPayment">Back</button></div></div></div></main><div id="footer"></div><div id="ui"></div><script src="../assets/data.js"></script><script>window.MAYUMI_SCRIPTS=["../assets/app.js", "../assets/media-player.js", "../assets/pages.js", "../assets/music-motion.js", "../assets/polish.js"];</script><script>/* Show navigation immediately while shared content loads. */
(function(){var h=document.getElementById('header');if(!h)return;var deep=document.body.dataset.depth==='1',root=deep?'../':'',page=document.body.dataset.page||'',items=[['','Home'],['music/','Music'],['shows/','Live Shows'],['artists/','Artists'],['shop/','Store'],['about/','About']];var icon='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';var menu='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';h.innerHTML='<div class="topline"></div><header><div class="navwrap"><a class="brand" href="'+root+'">MAYUMI<span>.</span>KASUGA</a><nav class="navlinks">'+items.map(function(x){return '<a class="'+(page===x[0].replace('/','')?'active':'')+'" href="'+root+x[0]+'">'+x[1]+'</a>'}).join('')+'</nav><div class="tools"><button class="iconbtn" id="bagBtn" aria-label="Open shopping bag">'+icon+'<span class="count" id="cartCount">0</span></button><button class="iconbtn hamb" id="menuBtn" aria-label="Open navigation">'+menu+'</button></div></div><nav class="mobilemenu" id="mobilemenu">'+items.map(function(x){return '<a href="'+root+x[0]+'">'+x[1]+'</a>'}).join('')+'</nav></header>';})();</script><script src="../assets/cloudflare-bridge.js"></script><script>(function(){function bind(){var h=document.getElementById('header');if(!h)return;function size(){document.documentElement.style.setProperty('--mayumi-header-height',Math.ceil(h.getBoundingClientRect().height)+'px')}size();window.addEventListener('resize',size);h.addEventListener('click',function(e){var b=e.target.closest('#menuBtn');if(!b)return;if(window.Mayumi)return;var m=h.querySelector('#mobilemenu');if(!m)return;var open=m.classList.toggle('open');document.body.classList.toggle('nav-open',open);b.setAttribute('aria-expanded',String(open));});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();})();</script></body></html>
